apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.springframework.boot'
apply plugin: 'application'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'kotlin'
apply plugin: "kotlin-kapt"
apply plugin: 'org.openjfx.javafxplugin'

tasks.withType(Jar) { it.duplicatesStrategy = DuplicatesStrategy.WARN }

dependencies {
    // Spring Boot 3 & Kotlin Core
    implementation "org.springframework.boot:spring-boot-starter:$springBootVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    // Modernisiertes Logging (kompatibel mit Kotlin 1.9+)
    implementation "io.github.oshai:kotlin-logging-jvm:5.1.4"

    // Nutzt direkt die lokale Version deiner Bibliothek
    implementation project(':sbjfx-lib')
}

// Zwingt das Demo-Modul auf Java 21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Konfiguration für den Kotlin-Compiler (angepasst an Java 21)
compileKotlin {
    kotlinOptions {
        freeCompilerArgs = ["-Xjsr305=strict"]
        jvmTarget = "21"
    }
}

// JavaFX Konfiguration für Java 21
javafx {
    version = "$javafxVersion"
    modules = ['javafx.base', 'javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

repositories {
    mavenCentral()
}
