name: Gradle Package Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        run: ./gradlew build

      - name: Publish to Sonatype staging API
        run: ./gradlew :sbjfx-lib:publishMavenJavaPublicationToSonatypeCentralRepository
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingKeyId: '006B9F89'

      - name: Transfer deployment to Central Portal
        shell: pwsh
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          $pair = "${env:MAVEN_USERNAME}:${env:MAVEN_PASSWORD}"
          $token = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair))
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/net.lustenauer?publishing_type=user_managed" `
            -Headers @{ Authorization = "Bearer $token" }

      - name: Publish to GitHub Packages
        run: ./gradlew :sbjfx-lib:publishMavenJavaPublicationToGitHubPackagesRepository
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}